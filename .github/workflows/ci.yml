name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test -p tern-tests
      - name: Build core bindings
        if: hashFiles('Package.swift') != ''
        run: cargo xtask build-core
      - name: Swift build
        if: hashFiles('Package.swift') != ''
        run: swift build
      - name: Swift tests
        if: hashFiles('Package.swift') != ''
        run: swift test
      - name: Bundle app
        if: hashFiles('Package.swift') != ''
        run: cargo xtask bundle
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: License and advisory check
        run: cargo deny check licenses advisories

  membench:
    runs-on: macos-15
    needs: macos
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Memory benchmark
        run: cargo xtask membench

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Check portable crates
        run: cargo check -p tern-core -p tern-mcp
      - name: Test
        run: cargo test -p tern-tests

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Forbidden flags
        run: bash scripts/forbidden-flags.sh
      - name: Shellcheck
        run: shellcheck scripts/capture-fixtures.sh
